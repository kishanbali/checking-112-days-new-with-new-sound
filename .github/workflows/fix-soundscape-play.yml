name: Fix soundscape play path

on:
  push:
    paths:
      - '.github/workflows/fix-soundscape-play.yml'

permissions:
  contents: write

jobs:
  fix-soundscape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix soundscape file mapping only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '''    const path = getSoundscapePath(currentDay) + `?v=${APP_VERSION}`;\n    if (audio.src.indexOf(getSoundscapePath(currentDay)) === -1) {\n      audio.src = path;\n    }'''
          new = '''    const currentSoundPath = getAudioForDay(currentDay);\n    const path = currentSoundPath + `?v=${APP_VERSION}`;\n    if (audio.src.indexOf(currentSoundPath) === -1) {\n      audio.src = path;\n      audio.load();\n    }'''
          if old not in s:
              raise SystemExit('Expected soundscape play block was not found; no change made.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit soundscape fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix soundscape playback mapping" || exit 0
          git push
