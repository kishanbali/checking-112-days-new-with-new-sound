name: Inspect Soundscape V3
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  inspect:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Inspect Soundscape code
        shell: python
        run: |
          from pathlib import Path
          lines = Path('index.html').read_text(encoding='utf-8').splitlines()
          keys = ('soundscape', 'Soundscape', 'getAudioForDay', 'getSoundscapePath', 'audio.play', 'audio.src', 'playSound')
          hits = [i for i,l in enumerate(lines) if any(k in l for k in keys)]
          print('MATCHED LINES:')
          for i in hits:
              a=max(0,i-5); b=min(len(lines),i+6)
              print(f'--- lines {a+1}-{b} ---')
              for j in range(a,b): print(f'{j+1}: {lines[j]}')
      - name: Remove temporary workflow
        run: rm -f .github/workflows/inspect-soundscape-v3.yml
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/inspect-soundscape-v3.yml
          git commit -m "Remove temporary inspection workflow"
          git push origin HEAD:${{ github.head_ref }}