name: Fix Soundscape Playback V4
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Force existing Soundscape reload on Play
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = """    const currentSoundPath = getAudioForDay(currentDay);\n    const path = currentSoundPath + `?v=${APP_VERSION}`;\n    if (audio.src.indexOf(currentSoundPath) === -1) {\n      audio.src = path;\n      audio.load();\n    }\n    audio.play().then(() => {"""
          new = """    const currentSoundPath = getAudioForDay(currentDay);\n    const path = currentSoundPath + `?v=${APP_VERSION}`;\n    audio.pause();\n    audio.removeAttribute('src');\n    audio.load();\n    audio.src = path;\n    audio.load();\n    audio.currentTime = 0;\n    audio.play().then(() => {"""
          if old not in s:
              raise SystemExit('Expected Soundscape Play block was not found; no files changed.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
      - name: Remove temporary workflows
        run: |
          rm -f .soundscape-fix-marker
          rm -f .github/workflows/fix-soundscape-play.yml
          rm -f .github/workflows/fix-soundscape-v2.yml
          rm -f .github/workflows/inspect-soundscape-v3.yml
          rm -f .github/workflows/fix-soundscape-v4.yml
      - name: Commit fix only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .soundscape-fix-marker .github/workflows/
          git diff --cached --quiet && exit 0
          git commit -m "Fix Soundscape play button"
          git push origin HEAD:${{ github.head_ref }}